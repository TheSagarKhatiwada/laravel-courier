version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courier_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - courier_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: courier_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/courier.conf:/etc/nginx/conf.d/default.conf
    networks:
      - courier_network

  db:
    image: mysql:8.0
    container_name: courier_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: courier_db
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: courier_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - courier_network

  redis:
    image: redis:alpine
    container_name: courier_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - courier_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courier_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - courier_network
    depends_on:
      - db
      - redis

networks:
  courier_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
